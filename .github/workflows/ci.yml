name: check

on:
  push:
    branches: [main]
  pull_request:

# Every action is pinned to the commit its release tag named when it was
# resolved with git ls-remote; the tag is in the comment beside it. The token
# starts with no permission, and each job asks for what it uses.
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Every distribution, dependencies included, by version and hash.
      - name: install build deps
        run: pip install --require-hashes --no-deps -r .github/requirements.txt

      # The JSON, the tenancy sub-package's data and the Python tests' copies of
      # the shared cases are all written by the build, the only step here that
      # writes to the tree. If running it changes anything, the committed files
      # and the YAML have diverged, and every consumer is reading something no
      # reviewer approved.
      - name: generated files are in step with the yaml
        run: |
          python3 scripts/build.py
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - run: go vet ./... && go test ./... -count=1
      - run: cd python && PYTHONPATH=src python3 -m pytest tests -q
