name: release

# Publishes the Python package to PyPI when a v* tag is pushed, by trusted
# publishing: PyPI accepts the upload when its project settings name this
# repository, this workflow and the pypi environment, so no token is stored
# anywhere, and the upload carries PEP 740 attestations signed with the same
# identity. A maintainer's approval and a v* deployment rule belong to the pypi
# environment, which is a repository setting this file cannot make: GitHub
# creates an environment a workflow names but the repository lacks, with no
# protection rule, so the environment and its rules must exist before a tag.
# The Go module needs no workflow: the Go proxy serves it from the tag.
on:
  push:
    tags: ['v*']

# Every action is pinned to the commit its release tag named when it was
# resolved with git ls-remote; the tag is in the comment beside it. The token
# starts with no permission. Building runs apart from publishing, so nothing
# the build runs can use the publishing identity.
permissions: {}

# One release at a time, and never one cancelled halfway through an upload.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Every distribution, dependencies included, by version and hash: the
      # tools here build the wheel the publish job uploads.
      - name: install the build tools
        run: pip install --require-hashes --no-deps -r .github/requirements.txt

      - name: the tag names the package's version
        run: test "$GITHUB_REF_NAME" = "v$(sed -n 's/^version = "\(.*\)"$/\1/p' python/pyproject.toml)"

      - name: generated files are in step with the yaml
        run: |
          python3 scripts/build.py
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - run: cd python && PYTHONPATH=src python3 -m pytest tests -q

      # --no-isolation builds with the hatchling pinned above rather than
      # whichever version an isolated build environment would fetch.
      - name: build the distributions
        run: python3 -m build --no-isolation --sdist --wheel --outdir dist python

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloudarq-issuers
    permissions:
      id-token: write   # PyPI's trusted publishing, and the attestations, are this job's OIDC token
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
